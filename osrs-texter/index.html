<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSRS Texter</title>
<style>
@font-face{font-family:'RuneLite RuneScape';src:url('https://raw.githubusercontent.com/runelite/runelite/master/runelite-client/src/main/resources/net/runelite/client/ui/runescape.ttf') format('truetype');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'RuneLite RuneScape Bold';src:url('https://raw.githubusercontent.com/runelite/runelite/master/runelite-client/src/main/resources/net/runelite/client/ui/runescape_bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:block}
@font-face{font-family:'RuneLite RuneScape Small';src:url('https://raw.githubusercontent.com/runelite/runelite/master/runelite-client/src/main/resources/net/runelite/client/ui/runescape_small.ttf') format('truetype');font-weight:400;font-style:normal;font-display:block}
:root{--panel:rgba(18,18,18,.94);--line:rgba(255,255,255,.16);--text:#f3f3f3;--muted:#bdbdbd;--accent:#d7a72d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:var(--text);font-family:'RuneLite RuneScape Small',system-ui,Segoe UI,Arial,sans-serif;font-size:24px}body{display:grid;grid-template-columns:400px minmax(420px,1fr) 400px;gap:0}.side{min-height:100vh;padding:20px;background:linear-gradient(180deg,#111,#080808);z-index:2}.left{border-right:1px solid var(--line);box-shadow:12px 0 42px rgba(0,0,0,.35)}.right{border-left:1px solid var(--line);box-shadow:-12px 0 42px rgba(0,0,0,.35)}.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px;margin-top:14px}label{display:block;color:var(--muted);font-size:24px;margin-bottom:7px}textarea,input,select,button{width:100%;border:1px solid rgba(255,255,255,.15);border-radius:10px;background:#101010;color:var(--text);padding:11px 12px;font:inherit;font-size:24px}textarea{min-height:390px;resize:vertical;line-height:1.35;font-family:'RuneLite RuneScape Small','RuneLite RuneScape',Georgia,serif}input[type=color]{height:52px;padding:4px}button{cursor:pointer;font-weight:400}button:hover{background:#1c1c1c;border-color:rgba(255,255,255,.28)}.primary{background:#2a2110;border-color:rgba(255,223,0,.44);color:#ffe979}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:flex;gap:10px;margin-top:12px}.row>*{flex:1}.small{font-size:22px;color:var(--muted);line-height:1.35}.number-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.number-pair input{min-width:0}#stageWrap{position:relative;min-height:100vh;display:grid;place-items:center;padding:26px 26px 92px;background:radial-gradient(circle at 50% 28%,rgba(255,223,0,.09),transparent 34%),linear-gradient(180deg,#0a0a0a,#000);overflow:auto}#previewShell{width:min(100%,980px);padding:14px;border:1px solid var(--line);border-radius:18px;background:rgba(12,12,12,.76);box-shadow:0 18px 70px rgba(0,0,0,.55)}#canvas{display:block;max-width:100%;height:auto;border-radius:10px;background:#000;image-rendering:auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;color:var(--muted);font-size:24px}a{color:#ffdf66;text-decoration:none}a:hover{text-decoration:underline}#infoTip{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(760px,calc(100vw - 44px));padding:12px 16px;border:1px solid rgba(255,223,0,.35);border-radius:14px;background:rgba(8,8,8,.92);box-shadow:0 10px 34px rgba(0,0,0,.55);text-align:center;z-index:5}#infoTip .title{font-size:30px;color:#ffff00;text-shadow:2px 2px #000;margin-bottom:4px}#infoTip .desc{font-size:22px;color:#ddd;line-height:1.25}@media(max-width:1180px){body{grid-template-columns:360px minmax(360px,1fr) 360px}html,body{font-size:22px}label,textarea,input,select,button,.topline{font-size:22px}.small,#infoTip .desc{font-size:20px}}@media(max-width:940px){body{display:block}.side{min-height:auto}.left,.right{border:0;border-bottom:1px solid var(--line);box-shadow:none}textarea{min-height:220px}#stageWrap{min-height:auto;padding:14px 14px 108px}#infoTip{position:fixed}}
</style>
</head>
<body>
<aside class="side left">
  <div class="card"><label for="text">Text</label><textarea id="text" spellcheck="false">Congratulations, you just advanced a Woodcutting level.</textarea><div class="row"><button id="sampleLevel" type="button">Level-up sample</button><button id="sampleChat" type="button">Chat sample</button></div></div>
  <div class="card"><button id="download" type="button" class="primary">Download PNG</button><div class="row"><button id="copy" type="button">Copy image</button><button id="reset" type="button">Reset</button></div><p id="status" class="small" aria-live="polite"></p></div>
</aside>
<main id="stageWrap"><section id="previewShell"><div class="topline"><span>Live preview</span><a href="/">← Back home</a></div><canvas id="canvas" width="1920" height="1080"></canvas></section></main>
<aside class="side right">
  <div class="card"><div class="grid2"><div><label>Canvas size</label><div class="number-pair"><input id="cw" type="number" min="320" max="3840" step="10" value="960" title="Width"><input id="ch" type="number" min="180" max="2160" step="10" value="540" title="Height"></div></div><div><label for="fontSize">Font size</label><input id="fontSize" type="number" min="8" max="240" step="1" value="72"></div><div><label for="lineHeight">Line height</label><input id="lineHeight" type="number" min="0.5" max="4" step="0.01" value="0.87"></div><div><label for="spaceWidth">Space width</label><input id="spaceWidth" type="number" min="0" max="8" step="0.05" value="1"></div><div><label for="align">Alignment</label><select id="align"><option value="center">Center</option><option value="left">Left</option><option value="right">Right</option></select></div></div></div>
  <div class="card"><div class="grid2"><div><label for="fontMode">Font style</label><select id="fontMode"><option value="osrs">RuneScape</option><option value="osrsBold">RuneScape bold</option><option value="osrsSmall">RuneScape small</option><option value="pixel">Pixel fallback</option><option value="serif">Classic serif</option></select></div><div><label for="renderScale">Render quality</label><select id="renderScale"><option value="1">Normal</option><option value="2" selected>Sharp 2×</option><option value="3">Sharp 3×</option><option value="4">Sharp 4×</option></select></div><div><label for="outlineMode">Outline style</label><select id="outlineMode"><option value="osrs" selected>OSRS shadow</option><option value="stroke">Heavy stroke</option><option value="none">None</option></select></div><div><label>Text color</label><input id="textColor" type="color" value="#ffff00"></div><div><label>Background</label><input id="bgColor" type="color" value="#000000"></div></div><div class="row"><button id="toggleShadow" type="button" class="primary">Shadow: on</button><button id="toggleHighlight" type="button">Highlight: off</button></div><p class="small">Space width changes how far regular spaces advance. Multiple spaces and leading indentation are preserved.</p></div>
</aside>
<div id="infoTip"><div class="title">OSRS Texter</div><div class="desc">Yellow text, black background OSRS text generator. Type your text, tweak it, then export a PNG.</div></div>
<script>
const el=id=>document.getElementById(id),canvas=el('canvas'),ctx=canvas.getContext('2d');
const state={shadow:true,highlight:false,fontsReady:false};
const controls=['text','cw','ch','fontSize','lineHeight','spaceWidth','align','fontMode','renderScale','outlineMode','textColor','bgColor'];
const samples={level:'Congratulations, you just advanced a Woodcutting level.',chat:'Woes: buying gf 10k\n     Selling lobster     200gp each'};
function fontStack(){const m=el('fontMode').value;if(m==='pixel')return '"Courier New",monospace';if(m==='serif')return 'Georgia,"Times New Roman",serif';if(m==='osrsBold')return '"RuneLite RuneScape Bold","RuneLite RuneScape","RuneScape UF",Georgia,"Times New Roman",serif';if(m==='osrsSmall')return '"RuneLite RuneScape Small","RuneLite RuneScape","RuneScape UF",Georgia,"Times New Roman",serif';return '"RuneLite RuneScape","RuneScape UF","Runescape UF",RuneScape,runescape,Georgia,"Times New Roman",serif'}
function fontWeight(){return el('fontMode').value==='osrsBold'?700:400}
function num(id,fallback){const n=Number(el(id).value);return Number.isFinite(n)?n:fallback}
function tokenized(line){return line.match(/[ \t]+|[^ \t]+/g)||['']}
function spaceAdvance(token){return ctx.measureText(' ').width*token.length*num('spaceWidth',1)}
function tokenWidth(token){return /^[ \t]+$/.test(token)?spaceAdvance(token):ctx.measureText(token).width}
function visualWidth(line){return tokenized(line).reduce((sum,t)=>sum+tokenWidth(t),0)}
function wrapText(text,maxWidth){const out=[];for(const raw of text.split('\n')){const tokens=tokenized(raw);let line='';for(const token of tokens){const test=line+token;if(line&&visualWidth(test)>maxWidth){out.push(line);line=token}else line=test}out.push(line)}return out}
function paintVisual(line,x,y,mode,maxWidth){const tokens=tokenized(line);let cursor=x;for(const token of tokens){if(/^[ \t]+$/.test(token)){cursor+=spaceAdvance(token);continue}if(mode==='stroke')ctx.strokeText(token,cursor,y,maxWidth);else ctx.fillText(token,cursor,y,maxWidth);cursor+=ctx.measureText(token).width}}
function drawLine(line,anchorX,y,maxWidth,size){const mode=el('outlineMode').value,offset=Math.max(1,Math.round(size/18)),width=visualWidth(line);let x=anchorX;if(ctx.textAlign==='center')x=anchorX-width/2;if(ctx.textAlign==='right')x=anchorX-width;x=Math.round(x);y=Math.round(y);const oldAlign=ctx.textAlign;ctx.textAlign='left';if(state.shadow&&mode==='osrs'){ctx.fillStyle='#000';paintVisual(line,x+offset,y+offset,'fill',maxWidth)}if(mode==='stroke'){ctx.strokeStyle='#000';ctx.lineWidth=Math.max(1,Math.round(size*.055));paintVisual(line,x,y,'stroke',maxWidth)}ctx.fillStyle=el('textColor').value;paintVisual(line,x,y,'fill',maxWidth);if(state.highlight){ctx.fillStyle='rgba(255,255,255,.12)';paintVisual(line,x,y-Math.max(1,Math.round(size/32)),'fill',maxWidth)}ctx.textAlign=oldAlign}
function draw(){const logicalW=Math.max(1,num('cw',960)),logicalH=Math.max(1,num('ch',540)),scale=num('renderScale',2);canvas.width=Math.round(logicalW*scale);canvas.height=Math.round(logicalH*scale);canvas.style.width=logicalW+'px';canvas.style.height=logicalH+'px';ctx.setTransform(scale,0,0,scale,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle=el('bgColor').value;ctx.fillRect(0,0,logicalW,logicalH);const size=Math.max(1,num('fontSize',72)),lineHeight=size*num('lineHeight',0.87);ctx.font=`${fontWeight()} ${size}px ${fontStack()}`;ctx.textAlign=el('align').value;ctx.textBaseline='middle';ctx.lineJoin='miter';ctx.miterLimit=2;const pad=Math.max(18,size),maxWidth=logicalW-pad*2,lines=wrapText(el('text').value,maxWidth);let x=logicalW/2;if(ctx.textAlign==='left')x=pad;if(ctx.textAlign==='right')x=logicalW-pad;const yCenter=logicalH/2,totalHeight=Math.max(0,(lines.length-1)*lineHeight),startY=yCenter-totalHeight/2;for(let i=0;i<lines.length;i++)drawLine(lines[i],x,startY+i*lineHeight,maxWidth,size)}
function reset(){el('text').value=samples.level;el('cw').value=960;el('ch').value=540;el('fontSize').value=72;el('lineHeight').value=0.87;el('spaceWidth').value=1;el('align').value='center';el('fontMode').value='osrs';el('renderScale').value=2;el('outlineMode').value='osrs';el('textColor').value='#ffff00';el('bgColor').value='#000000';state.shadow=true;state.highlight=false;el('toggleShadow').textContent='Shadow: on';el('toggleHighlight').textContent='Highlight: off';draw()}
controls.forEach(id=>el(id).addEventListener('input',draw));
el('sampleLevel').addEventListener('click',()=>{el('text').value=samples.level;el('align').value='center';draw()});
el('sampleChat').addEventListener('click',()=>{el('text').value=samples.chat;el('align').value='left';draw()});
el('toggleShadow').addEventListener('click',()=>{state.shadow=!state.shadow;el('toggleShadow').textContent='Shadow: '+(state.shadow?'on':'off');draw()});
el('toggleHighlight').addEventListener('click',()=>{state.highlight=!state.highlight;el('toggleHighlight').textContent='Highlight: '+(state.highlight?'on':'off');draw()});
el('download').addEventListener('click',()=>{const a=document.createElement('a');a.download='osrs-text.png';a.href=canvas.toDataURL('image/png');a.click()});
el('copy').addEventListener('click',async()=>{try{const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);el('status').textContent='Copied image to clipboard.'}catch(e){el('status').textContent='Copy did not work in this browser, but download still works.'}});
el('reset').addEventListener('click',reset);
Promise.allSettled([document.fonts.load('32px "RuneLite RuneScape"'),document.fonts.load('32px "RuneLite RuneScape Bold"'),document.fonts.load('32px "RuneLite RuneScape Small"')]).then(()=>{state.fontsReady=true;draw();el('status').textContent='Fonts loaded.'});
draw();
</script>
</body>
</html>
