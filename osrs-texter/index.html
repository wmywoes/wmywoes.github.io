<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSRS Texter</title>
<style>
@font-face{font-family:'RuneLite RuneScape';src:url('https://raw.githubusercontent.com/runelite/runelite/master/runelite-client/src/main/resources/net/runelite/client/ui/runescape.ttf') format('truetype');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'RuneLite RuneScape Bold';src:url('https://raw.githubusercontent.com/runelite/runelite/master/runelite-client/src/main/resources/net/runelite/client/ui/runescape_bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:block}
@font-face{font-family:'RuneLite RuneScape Small';src:url('https://raw.githubusercontent.com/runelite/runelite/master/runelite-client/src/main/resources/net/runelite/client/ui/runescape_small.ttf') format('truetype');font-weight:400;font-style:normal;font-display:block}
:root{--bg:#080808;--panel:rgba(18,18,18,.94);--line:rgba(255,255,255,.16);--text:#f3f3f3;--muted:#a8a8a8;--accent:#d7a72d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:var(--text);font-family:system-ui,Segoe UI,Arial,sans-serif}body{display:grid;grid-template-columns:360px 1fr;gap:0}#controls{min-height:100vh;padding:18px;background:linear-gradient(180deg,#111,#080808);border-right:1px solid var(--line);box-shadow:12px 0 42px rgba(0,0,0,.4);z-index:2}h1{margin:0 0 4px;font-size:22px}.subtitle{color:var(--muted);font-size:13px;line-height:1.35;margin-bottom:14px}.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px;margin-top:12px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}textarea,input,select,button{width:100%;border:1px solid rgba(255,255,255,.15);border-radius:10px;background:#101010;color:var(--text);padding:9px 10px;font:inherit}textarea{min-height:110px;resize:vertical;line-height:1.35}input[type=color]{height:42px;padding:4px}input[type=range]{padding:0;accent-color:var(--accent)}button{cursor:pointer;font-weight:700}button:hover{background:#1c1c1c;border-color:rgba(255,255,255,.28)}.primary{background:#2a2110;border-color:rgba(255,223,0,.44);color:#ffe979}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:10px;margin-top:10px}.row>*{flex:1}.small{font-size:12px;color:var(--muted);line-height:1.35}.value{float:right;color:#e6e6e6}#stageWrap{min-height:100vh;display:grid;place-items:center;padding:26px;background:radial-gradient(circle at 50% 28%,rgba(255,223,0,.09),transparent 34%),linear-gradient(180deg,#0a0a0a,#000);overflow:auto}#previewShell{width:min(100%,980px);padding:14px;border:1px solid var(--line);border-radius:18px;background:rgba(12,12,12,.76);box-shadow:0 18px 70px rgba(0,0,0,.55)}#canvas{display:block;max-width:100%;height:auto;border-radius:10px;background:#000;image-rendering:auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;color:var(--muted);font-size:12px}a{color:#ffdf66;text-decoration:none}a:hover{text-decoration:underline}@media(max-width:860px){body{display:block}#controls{min-height:auto;border-right:0;border-bottom:1px solid var(--line)}#stageWrap{min-height:auto;padding:14px}}
</style>
</head>
<body>
<aside id="controls">
<h1>OSRS Texter</h1>
<div class="subtitle">Black-screen OSRS text generator. Type your text, tweak it, then export a PNG.</div>
<div class="card"><label for="text">Text</label><textarea id="text" spellcheck="false">Congratulations, you just advanced a Woodcutting level.</textarea><div class="row"><button id="sampleLevel" type="button">Level-up sample</button><button id="sampleChat" type="button">Chat sample</button></div></div>
<div class="card"><div class="grid2">
<div><label>Canvas width <span id="wVal" class="value"></span></label><input id="cw" type="range" min="320" max="1920" step="10" value="960"></div>
<div><label>Canvas height <span id="hVal" class="value"></span></label><input id="ch" type="range" min="180" max="1080" step="10" value="540"></div>
<div><label>Font size <span id="sizeVal" class="value"></span></label><input id="fontSize" type="range" min="12" max="96" step="1" value="32"></div>
<div><label>Line height <span id="lineVal" class="value"></span></label><input id="lineHeight" type="range" min="0.8" max="2" step="0.05" value="1.15"></div>
<div><label>X position <span id="xVal" class="value"></span></label><input id="posX" type="range" min="0" max="100" step="1" value="50"></div>
<div><label>Y position <span id="yVal" class="value"></span></label><input id="posY" type="range" min="0" max="100" step="1" value="50"></div>
</div></div>
<div class="card"><div class="grid2">
<div><label for="align">Alignment</label><select id="align"><option value="center">Center</option><option value="left">Left</option><option value="right">Right</option></select></div>
<div><label for="fontMode">Font style</label><select id="fontMode"><option value="osrs">RuneScape</option><option value="osrsBold">RuneScape bold</option><option value="osrsSmall">RuneScape small</option><option value="pixel">Pixel fallback</option><option value="serif">Classic serif</option></select></div>
<div><label for="renderScale">Render quality</label><select id="renderScale"><option value="1">Normal</option><option value="2" selected>Sharp 2×</option><option value="3">Sharp 3×</option><option value="4">Sharp 4×</option></select></div>
<div><label for="outlineMode">Outline style</label><select id="outlineMode"><option value="osrs" selected>OSRS shadow</option><option value="stroke">Heavy stroke</option><option value="none">None</option></select></div>
<div><label>Text color</label><input id="textColor" type="color" value="#ffff00"></div><div><label>Background</label><input id="bgColor" type="color" value="#000000"></div>
</div><div class="row"><button id="toggleShadow" type="button" class="primary">Shadow: on</button><button id="toggleHighlight" type="button">Highlight: off</button></div><p class="small">Sharp mode renders internally at a higher resolution so the preview and exported PNG look less jagged. OSRS shadow uses offset text instead of a thick canvas stroke.</p></div>
<div class="card"><button id="download" type="button" class="primary">Download PNG</button><div class="row"><button id="copy" type="button">Copy image</button><button id="reset" type="button">Reset</button></div><p id="status" class="small" aria-live="polite"></p></div>
</aside>
<main id="stageWrap"><section id="previewShell"><div class="topline"><span>Live preview</span><a href="/">← Back home</a></div><canvas id="canvas" width="1920" height="1080"></canvas></section></main>
<script>
const el=id=>document.getElementById(id),canvas=el('canvas'),ctx=canvas.getContext('2d');
const state={shadow:true,highlight:false,fontsReady:false};
const controls=['text','cw','ch','fontSize','lineHeight','posX','posY','align','fontMode','renderScale','outlineMode','textColor','bgColor'];
const samples={level:'Congratulations, you just advanced a Woodcutting level.',chat:'Woes: buying gf 10k\nSelling lobster 200gp each'};
function fontStack(){const m=el('fontMode').value;if(m==='pixel')return '"Courier New",monospace';if(m==='serif')return 'Georgia,"Times New Roman",serif';if(m==='osrsBold')return '"RuneLite RuneScape Bold","RuneLite RuneScape","RuneScape UF",Georgia,"Times New Roman",serif';if(m==='osrsSmall')return '"RuneLite RuneScape Small","RuneLite RuneScape","RuneScape UF",Georgia,"Times New Roman",serif';return '"RuneLite RuneScape","RuneScape UF","Runescape UF",RuneScape,runescape,Georgia,"Times New Roman",serif'}
function fontWeight(){return el('fontMode').value==='osrsBold'?700:400}
function updateLabels(){el('wVal').textContent=el('cw').value+'px';el('hVal').textContent=el('ch').value+'px';el('sizeVal').textContent=el('fontSize').value+'px';el('lineVal').textContent=el('lineHeight').value+'×';el('xVal').textContent=el('posX').value+'%';el('yVal').textContent=el('posY').value+'%'}
function wrapText(text,maxWidth){const out=[];for(const raw of text.split('\n')){const words=raw.split(/\s+/).filter(Boolean);if(!words.length){out.push('');continue}let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){out.push(line);line=word}else line=test}out.push(line)}return out}
function drawLine(line,x,y,maxWidth,size){const mode=el('outlineMode').value,offset=Math.max(1,Math.round(size/18));x=Math.round(x);y=Math.round(y);if(state.shadow&&mode==='osrs'){ctx.fillStyle='#000';ctx.fillText(line,x+offset,y+offset,maxWidth)}if(mode==='stroke'){ctx.strokeStyle='#000';ctx.lineWidth=Math.max(1,Math.round(size*.055));ctx.strokeText(line,x,y,maxWidth)}ctx.fillStyle=el('textColor').value;ctx.fillText(line,x,y,maxWidth);if(state.highlight){ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillText(line,x,y-Math.max(1,Math.round(size/32)),maxWidth)}}
function draw(){updateLabels();const logicalW=+el('cw').value,logicalH=+el('ch').value,scale=+el('renderScale').value;canvas.width=Math.round(logicalW*scale);canvas.height=Math.round(logicalH*scale);canvas.style.width=logicalW+'px';canvas.style.height=logicalH+'px';ctx.setTransform(scale,0,0,scale,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle=el('bgColor').value;ctx.fillRect(0,0,logicalW,logicalH);const size=+el('fontSize').value,lineHeight=size*(+el('lineHeight').value);ctx.font=`${fontWeight()} ${size}px ${fontStack()}`;ctx.textAlign=el('align').value;ctx.textBaseline='middle';ctx.lineJoin='miter';ctx.miterLimit=2;const pad=Math.max(18,size),maxWidth=logicalW-pad*2,lines=wrapText(el('text').value,maxWidth);let x=logicalW*(+el('posX').value)/100;if(ctx.textAlign==='left')x=Math.max(pad,x);if(ctx.textAlign==='right')x=Math.min(logicalW-pad,x);const yCenter=logicalH*(+el('posY').value)/100,totalHeight=Math.max(0,(lines.length-1)*lineHeight),startY=yCenter-totalHeight/2;for(let i=0;i<lines.length;i++)drawLine(lines[i],x,startY+i*lineHeight,maxWidth,size)}
function reset(){el('text').value=samples.level;el('cw').value=960;el('ch').value=540;el('fontSize').value=32;el('lineHeight').value=1.15;el('posX').value=50;el('posY').value=50;el('align').value='center';el('fontMode').value='osrs';el('renderScale').value=2;el('outlineMode').value='osrs';el('textColor').value='#ffff00';el('bgColor').value='#000000';state.shadow=true;state.highlight=false;el('toggleShadow').textContent='Shadow: on';el('toggleHighlight').textContent='Highlight: off';draw()}
controls.forEach(id=>el(id).addEventListener('input',draw));
el('sampleLevel').addEventListener('click',()=>{el('text').value=samples.level;el('align').value='center';el('posX').value=50;el('posY').value=50;draw()});
el('sampleChat').addEventListener('click',()=>{el('text').value=samples.chat;el('align').value='left';el('posX').value=10;el('posY').value=16;draw()});
el('toggleShadow').addEventListener('click',()=>{state.shadow=!state.shadow;el('toggleShadow').textContent='Shadow: '+(state.shadow?'on':'off');draw()});
el('toggleHighlight').addEventListener('click',()=>{state.highlight=!state.highlight;el('toggleHighlight').textContent='Highlight: '+(state.highlight?'on':'off');draw()});
el('download').addEventListener('click',()=>{const a=document.createElement('a');a.download='osrs-text.png';a.href=canvas.toDataURL('image/png');a.click()});
el('copy').addEventListener('click',async()=>{try{const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);el('status').textContent='Copied image to clipboard.'}catch(e){el('status').textContent='Copy did not work in this browser, but download still works.'}});
el('reset').addEventListener('click',reset);
Promise.allSettled([document.fonts.load('32px "RuneLite RuneScape"'),document.fonts.load('32px "RuneLite RuneScape Bold"'),document.fonts.load('32px "RuneLite RuneScape Small"')]).then(()=>{state.fontsReady=true;draw();el('status').textContent='Fonts loaded. Try Sharp 2×/3× if the preview looks choppy.'});
draw();
</script>
</body>
</html>
